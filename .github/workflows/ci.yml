name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

env:
  NODE_VERSION: '22'

# デプロイフロー:
# - Preview (PR): deploy-preview.yml が Ready for review で実行
# - Staging (main push): deploy-staging.yml が自動実行
# - Production: deploy-production.yml を workflow_dispatch で手動実行
# このワークフローはチェック(lint + typecheck + test + actionlint)を担当
#
# トリガー設計（oak-casino と同じ Draft + Ready for review 方式）:
# - push (main): マージ後の最終 CI
# - pull_request: Draft 中は job 側 `draft == false` ガードで skip し、
#   「Ready for review」ボタン（ready_for_review）で発火する
# - workflow_dispatch: 手動トリガー
#
# - runs-on は vars.CI_RUNNER で切替可能（未設定なら GitHub ホスト）。

jobs:
  actionlint:
    name: Actionlint
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    steps:
      - uses: actions/checkout@v4

      - name: Run actionlint
        uses: docker://rhysd/actionlint:latest
        with:
          args: -color

  lint-and-typecheck:
    name: Lint & Type Check & Test
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check migration version uniqueness
        run: npm run check:migrations

      - name: Validate evidence data quality
        # 出典の必須性・効果値のサニティ・calculationLogic 整合・プリセット参照を検証。
        # 到達性チェック(--online)はネットワーク依存のため CI では回さない（ローカル任意実行）。
        run: npm run validate:evidence

      - name: Run ESLint
        run: npm run lint

      - name: TypeScript type check (via Next.js build)
        run: npx next build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          # 型チェック中の OOM (JavaScript heap out of memory) 回避。
          # runner デフォルトのヒープ上限(約2GB)を引き上げる。
          NODE_OPTIONS: '--max-old-space-size=4096'

      - name: Run unit tests (Vitest)
        run: npm run test:run

  # Playwright E2E テスト（必要になったらコメントを外して有効化する）。
